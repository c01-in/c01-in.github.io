name: Deploy On Tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            echo "[heartbeat] vite build running at $(date -u +%H:%M:%S)"
            sleep 20
          done &
          HEARTBEAT_PID=$!
          cleanup() {
            kill "$HEARTBEAT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          npm exec vite build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: colin.quarksgames.com
          force_orphan: true
          enable_jekyll: false
